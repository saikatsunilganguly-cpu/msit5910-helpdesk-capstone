<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{% block title %}Helpdesk Prototype{% endblock %}</title>
    <style>
        body { font-family: -apple-system, Segoe UI, Arial, sans-serif; max-width: 720px; margin: 40px auto; color: #1a1a1a; }
        h1 { font-size: 1.4rem; }
        nav { margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid #ddd; }
        nav a { margin-right: 16px; color: #2557a7; text-decoration: none; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .priority-High, .priority-Critical { background: #fde2e2; color: #a11; }
        .priority-Medium { background: #fff4d6; color: #8a5300; }
        .priority-Low { background: #e3f4e3; color: #226622; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
        input[type=text], textarea { width: 100%; padding: 8px; margin: 6px 0 14px; box-sizing: border-box; }
        button { padding: 8px 16px; background: #2557a7; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .result-box { background: #f0f6ff; border: 1px solid #cfe0f7; padding: 14px; border-radius: 6px; margin-top: 16px; }
        .restricted { color: #999; font-style: italic; }
        .error { color: #a11; }
        .role-tag { color: #666; font-size: 0.85rem; }
    </style>
</head>
<body>
    {% if session['username'] %}
    <nav>
        Logged in as <strong>{{ session['username'] }}</strong> <span class="role-tag">({{ session['role'] }})</span>
        &mdash;
        <a href="/submit">Submit Ticket</a>
        <a href="/queue">Ticket Queue</a>
        <a href="/logout">Log out</a>
    </nav>
    {% endif %}
    {% block content %}{% endblock %}
</body>
</html>
