name: tests

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all 55 tests with coverage
        run: >
          python -m pytest -v
          --cov=app --cov=categorization --cov=models
          --cov-report=term
          --junitxml=test-results.xml

      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: prototype/test-results.xml
